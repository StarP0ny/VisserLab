<title>Visser Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
<style>
/* Приборная стойка: слева шина приборов и журнал, справа поле панелей; сверху строка записи и шкала времени */
:root {
  --bg:#E8ECF0; --surface:#F4F6F9; --panel:#FFFFFF; --line:#D2D9E1; --line-2:#E4E9EE;
  --fg:#14202C; --muted:#586677; --faint:#8793A2;
  --accent:#2B48C8; --accent-weak:#E1E6F9; --on-accent:#FFFFFF;
  --rec:#CC3226; --rec-weak:#FAE2DF; --on-rec:#FFFFFF;
  --pause:#A86F00; --pause-weak:#FAEDCF;
  --ok:#1B8550; --ok-weak:#DBF0E4; --err:#C42E3B; --err-weak:#F9DEE1;
  --grid:rgba(20,32,44,.075); --scrim:rgba(20,32,44,.38);
  --shadow:0 1px 2px rgba(20,32,44,.06),0 10px 30px rgba(20,32,44,.12);
  --s1:#2F62D9; --s2:#DE6C16; --s3:#10907E; --s4:#C23A89; --s5:#788A0E; --s6:#7450D0; --s7:#B04832; --s8:#4F667E;
  --f-ui:"Golos Text","Segoe UI",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-brand:"Unbounded","Golos Text",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0C1116; --surface:#121920; --panel:#172029; --line:#293441; --line-2:#1F2833;
  --fg:#E2E8EE; --muted:#92A0AF; --faint:#647287;
  --accent:#8DA1FF; --accent-weak:#1C2650; --on-accent:#0C1116;
  --rec:#FF5A4E; --rec-weak:#3A1917; --on-rec:#1B0B09;
  --pause:#F2B53A; --pause-weak:#382C11;
  --ok:#3CC37E; --ok-weak:#113222; --err:#FF6472; --err-weak:#3A1820;
  --grid:rgba(226,232,238,.07); --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.45);
  --s1:#6E94FF; --s2:#FF9944; --s3:#3BCEB5; --s4:#EF6FB7; --s5:#B8CA3D; --s6:#A78AFF; --s7:#EF7A5F; --s8:#99AFC5;
  color-scheme:dark;
} }
:root[data-theme="dark"] {
  --bg:#0C1116; --surface:#121920; --panel:#172029; --line:#293441; --line-2:#1F2833;
  --fg:#E2E8EE; --muted:#92A0AF; --faint:#647287;
  --accent:#8DA1FF; --accent-weak:#1C2650; --on-accent:#0C1116;
  --rec:#FF5A4E; --rec-weak:#3A1917; --on-rec:#1B0B09;
  --pause:#F2B53A; --pause-weak:#382C11;
  --ok:#3CC37E; --ok-weak:#113222; --err:#FF6472; --err-weak:#3A1820;
  --grid:rgba(226,232,238,.07); --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.45);
  --s1:#6E94FF; --s2:#FF9944; --s3:#3BCEB5; --s4:#EF6FB7; --s5:#B8CA3D; --s6:#A78AFF; --s7:#EF7A5F; --s8:#99AFC5;
  color-scheme:dark;
}

html, body { height:100%; }
body { background:var(--bg); color:var(--fg); font:14px/1.45 var(--f-ui); }
*, *::before, *::after { box-sizing:border-box; }
button, input, select { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.num, .mono { font-family:var(--f-num); font-variant-numeric:tabular-nums; }
.lbl { font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; }
svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; }

#app { height:100%; padding-block:12px; padding-inline:16px; }
.screen { height:100%; }
.scroll { overflow:auto; }

/* ---------- кнопки и поля ---------- */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:34px; padding-inline:14px; border:1px solid var(--line); background:var(--panel); border-radius:8px; cursor:pointer; font-weight:500; white-space:nowrap; }
.btn:hover:not(:disabled) { border-color:var(--faint); }
.btn:disabled, .btn[aria-disabled="true"] { opacity:.42; cursor:not-allowed; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.btn.rec { background:var(--rec); border-color:var(--rec); color:var(--on-rec); }
.btn.warn { background:var(--pause-weak); border-color:var(--pause); color:var(--fg); }
.btn.drag-ghost { background:transparent; border-color:transparent; }
.btn.ghost:hover:not(:disabled) { background:var(--surface); border-color:var(--line); }
.btn.sm { min-height:28px; padding-inline:10px; font-size:13px; }
.icon-btn { display:inline-grid; place-items:center; width:30px; height:30px; border-radius:7px; border:1px solid transparent; background:transparent; cursor:pointer; color:var(--muted); }
.icon-btn:hover { background:var(--surface); border-color:var(--line); color:var(--fg); }
input[type=text], input[type=number], select { height:34px; border:1px solid var(--line); background:var(--panel); border-radius:7px; padding-inline:10px; min-width:0; }
input::placeholder { color:var(--faint); }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel); }
.seg button { border:0; background:transparent; padding:5px 11px; cursor:pointer; color:var(--muted); font-size:13px; }
.seg button + button { border-left:1px solid var(--line); }
.seg button[aria-pressed="true"] { background:var(--accent-weak); color:var(--fg); font-weight:600; }
.sw { position:relative; display:inline-flex; align-items:center; gap:9px; cursor:pointer; user-select:none; }
.sw input { position:absolute; opacity:0; width:1px; height:1px; }
.sw span { width:34px; height:20px; border-radius:10px; background:var(--line); position:relative; transition:background .15s; flex:none; }
.sw span::after { content:""; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:var(--panel); box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s; }
.sw input:checked + span { background:var(--accent); }
.sw input:checked + span::after { transform:translateX(14px); }
.sw input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
.sw input:disabled + span { opacity:.45; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none; }
.dot.ok { background:var(--ok); } .dot.err { background:var(--err); } .dot.warn { background:var(--pause); } .dot.chk { background:var(--accent); animation:blink 1s infinite; }
.dot.rec { background:var(--rec); animation:blink 1.4s infinite; }
.ii { display:inline-grid; place-items:center; width:16px; height:16px; border-radius:50%; border:1px solid var(--line); color:var(--muted); font:600 10px/1 var(--f-ui); font-style:normal; cursor:help; vertical-align:1px; margin-left:6px; text-transform:none; letter-spacing:0; }
.ii:hover, .ii:focus-visible { border-color:var(--faint); color:var(--fg); }
.lk { color:var(--pause); margin-left:6px; cursor:help; display:inline-flex; vertical-align:-2px; }
.lk svg.i { width:14px; height:14px; }
.tip { position:fixed; z-index:90; max-width:300px; padding:7px 10px; border-radius:8px; background:var(--fg); color:var(--bg); font:400 12.5px/1.4 var(--f-ui); white-space:pre-line; pointer-events:none; box-shadow:var(--shadow); }
@keyframes blink { 50% { opacity:.25; } }
.chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:2px 8px; border-radius:999px; background:var(--surface); border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
.chip.ok { background:var(--ok-weak); border-color:transparent; color:var(--fg); }
.chip.err { background:var(--err-weak); border-color:transparent; color:var(--fg); }
.chip.chk { background:var(--accent-weak); border-color:transparent; color:var(--fg); }

/* ---------- окно 0 ---------- */
.home { max-width:900px; margin-inline:auto; padding-block:28px 40px; display:flex; flex-direction:column; gap:28px; }
.brand { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.brand h1 { font:600 26px/1.1 var(--f-brand); letter-spacing:-.01em; margin:0; }
.brand p { margin:0; color:var(--muted); }
.plate { border:1px solid var(--rec); background:var(--rec-weak); border-radius:14px; padding:22px 24px; display:grid; grid-template-columns:1fr auto; gap:14px 24px; align-items:center; }
.plate.pause { border-color:var(--pause); background:var(--pause-weak); }
.plate.prep { border-color:var(--accent); background:var(--accent-weak); }
.plate .st { display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:13px; }
.plate .st .dot { width:10px; height:10px; }
.plate h2 { margin:4px 0 0; font:600 22px/1.2 var(--f-ui); text-wrap:balance; }
.plate .meta { color:var(--muted); display:flex; gap:16px; flex-wrap:wrap; margin-top:6px; }
.plate .acts { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.plate .btn.primary { min-height:44px; padding-inline:22px; font-size:15px; }
.acts2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.big { text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:22px; cursor:pointer; display:grid; gap:6px; }
.big:hover:not(:disabled) { border-color:var(--accent); }
.big:disabled { opacity:.5; cursor:not-allowed; }
.big b { font:600 19px/1.2 var(--f-brand); }
.big span { color:var(--muted); }
.cols2 { display:grid; grid-template-columns:1fr 1.4fr; gap:28px; }
.list { list-style:none; margin:10px 0 0; padding:0; display:grid; }
.list li { display:flex; justify-content:space-between; gap:12px; padding-block:9px; border-bottom:1px solid var(--line-2); }
.list li span:last-child { color:var(--muted); }
.note { color:var(--muted); font-size:13px; border-top:1px dashed var(--line); padding-top:14px; max-width:68ch; }
kbd { font-family:var(--f-num); font-size:12px; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; background:var(--panel); }

/* ---------- шаги 1 и 1.1 ---------- */
.wiz { max-width:1180px; margin-inline:auto; display:flex; flex-direction:column; gap:18px; padding-block:6px 0; min-height:100%; }
.wiz-h { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.wiz-h h2 { margin:0; font:600 20px/1.2 var(--f-brand); }
.steps { display:flex; gap:6px; align-items:center; margin-left:auto; color:var(--muted); font-size:13px; flex-wrap:wrap; }
.steps span { padding:3px 10px; border-radius:999px; border:1px solid var(--line); }
.steps span.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.wiz-row { display:flex; gap:12px; flex-wrap:wrap; align-items:end; }
.field { display:grid; gap:4px; }
.field input, .field select { width:260px; max-width:100%; }
.toolbar { display:flex; gap:10px 16px; flex-wrap:wrap; align-items:center; padding-block:10px; border-block:1px solid var(--line); }
.toolbar .sp { flex:1; }
.grp { display:grid; gap:10px; }
.grp-h { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.grp-h .hid { color:var(--faint); font-size:12px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
.tile { position:relative; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-items:start; padding:14px; border:1px solid var(--line); background:var(--panel); border-radius:12px; cursor:pointer; text-align:left; }
.tile:hover { border-color:var(--faint); }
.tile[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); background:linear-gradient(var(--accent-weak),var(--accent-weak)) padding-box; }
.tile.off { opacity:.55; cursor:not-allowed; }
.tile .ic { width:38px; height:38px; border-radius:9px; display:grid; place-items:center; background:var(--surface); border:1px solid var(--line-2); grid-row:span 3; }
.tile .ic svg.i { width:21px; height:21px; }
.tile .nm { font-weight:600; padding-right:52px; }
.tile .md { color:var(--muted); font-size:12.5px; }
.tile .cn { font-family:var(--f-num); font-size:11.5px; color:var(--muted); }
.tile .row { grid-column:1 / -1; display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:8px; }
.tile .ck { position:absolute; top:12px; right:12px; width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line); display:grid; place-items:center; background:var(--panel); }
.tile[aria-pressed="true"] .ck { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.tile .ck svg { width:13px; height:13px; stroke-width:2.4; }
.rows { display:grid; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--panel); }
.rowi { display:grid; grid-template-columns:26px 28px minmax(140px,1.2fr) minmax(120px,1fr) minmax(160px,1.4fr) auto auto; gap:12px; align-items:center; padding:9px 12px; border-bottom:1px solid var(--line-2); cursor:pointer; }
.rowi:last-child { border-bottom:0; }
.rowi[aria-pressed="true"] { background:var(--accent-weak); }
.rowi.off { opacity:.55; cursor:not-allowed; }
.rowi .ck2 { width:16px; height:16px; border-radius:4px; border:1.5px solid var(--line); display:grid; place-items:center; }
.rowi[aria-pressed="true"] .ck2 { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.rowi .ck2 svg { width:11px; height:11px; stroke-width:2.6; }
.rowi .cn { font-family:var(--f-num); font-size:12px; color:var(--muted); }
.rowi .md { color:var(--muted); font-size:13px; }
.wiz-f { position:sticky; bottom:0; margin-top:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding-block:12px; background:var(--bg); border-top:1px solid var(--line); }
.wiz-f .sp { flex:1; }
.cfg { display:grid; grid-template-columns:260px 1fr; gap:18px; align-items:start; }
.cfg-list { display:grid; gap:4px; }
.cfg-list button { display:flex; gap:10px; align-items:center; text-align:left; padding:9px 11px; border-radius:9px; border:1px solid transparent; background:transparent; cursor:pointer; }
.cfg-list button:hover { background:var(--surface); }
.cfg-list button[aria-current="true"] { background:var(--panel); border-color:var(--line); font-weight:600; }
.cfg-list small { color:var(--muted); font-weight:400; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
.card-h { display:flex; align-items:center; gap:12px; margin-bottom:6px; flex-wrap:wrap; }
.card-h h3 { margin:0; font-size:17px; }

/* ---------- форма настроек (общая для 1.1 и окна прибора) ---------- */
.form { display:grid; }
.f-row { display:grid; grid-template-columns:minmax(150px,230px) 1fr; gap:4px 16px; align-items:center; padding-block:10px; border-bottom:1px solid var(--line-2); }
.f-row:last-child { border-bottom:0; }
.f-l { font-weight:500; }
.f-l em { font-style:normal; font-size:11px; color:var(--ok); margin-left:6px; white-space:nowrap; }
.f-c { display:flex; gap:8px; align-items:center; min-width:0; }
.f-c select, .f-c input[type=text], .f-c input[type=number] { width:240px; max-width:100%; }
.unit { color:var(--muted); font-family:var(--f-num); font-size:12.5px; }
.f-h { grid-column:2; margin:0; color:var(--muted); font-size:12.5px; max-width:60ch; }
.f-h.lock { color:var(--pause); }
.f-info { color:var(--muted); font-size:13px; }

/* ---------- панель опыта ---------- */
.exp { display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; gap:10px; }
.topbar { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 10px; }
.runname { font-weight:600; font-size:15px; border:1px solid transparent; background:transparent; height:32px; width:150px; }
.runname:hover, .runname:focus { border-color:var(--line); }
.state { display:inline-flex; align-items:center; gap:8px; padding:4px 11px; border-radius:999px; font-size:12px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; background:var(--surface); border:1px solid var(--line); }
.state .dot { width:9px; height:9px; }
.state.rec { background:var(--rec-weak); border-color:transparent; } .state.rec .dot { background:var(--rec); animation:blink 1.4s infinite; }
.state.pause { background:var(--pause-weak); border-color:transparent; } .state.pause .dot { background:var(--pause); }
.state.prep .dot { background:var(--accent); }
.clock { font:500 22px/1 var(--f-num); font-variant-numeric:tabular-nums; min-width:5.5ch; }
.clock small { font-size:11px; color:var(--muted); display:block; font-family:var(--f-ui); margin-top:3px; }
.stat { display:inline-flex; align-items:center; gap:5px; border:0; background:transparent; border-radius:999px; padding:3px 9px 3px 5px; cursor:pointer; font:600 13px var(--f-num); vertical-align:middle; }
.stat svg.i { width:20px; height:20px; }
.stat.ok { color:var(--ok); padding-right:5px; } .stat.ok b { display:none; }
.stat.warn { color:var(--pause); background:var(--pause-weak); }
.stat.crit { color:var(--err); background:var(--err-weak); }
.ctrl { display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; }
.ctrl .btn { min-height:38px; }
.demo { position:relative; }
.pop { position:absolute; right:0; top:calc(100% + 6px); z-index:30; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px; display:grid; gap:12px; width:260px; }
.pop p { margin:0; color:var(--muted); font-size:12.5px; }
.timeline { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.tl { position:relative; flex:1; min-width:220px; height:26px; border-radius:7px; background:var(--panel); border:1px solid var(--line); overflow:hidden; }
.tl i { position:absolute; top:0; bottom:0; }
.tl .pre { background:repeating-linear-gradient(135deg,var(--line-2) 0 5px,transparent 5px 10px); }
.tl .recd { background:var(--accent-weak); }
.tl .prep { background:repeating-linear-gradient(135deg,var(--line-2) 0 5px,transparent 5px 10px); }
.tl .pz { background:repeating-linear-gradient(135deg,var(--pause) 0 3px,transparent 3px 7px); opacity:.55; }
.tl b { position:absolute; top:4px; bottom:4px; width:2px; border-radius:1px; background:var(--muted); }
.tl b.warn { background:var(--pause); } .tl b.crit { background:var(--err); } .tl b.set { background:var(--accent); } .tl b.manual { background:var(--s4); }
.tl .win { position:absolute; top:1px; bottom:1px; border:1.5px solid var(--fg); border-radius:5px; opacity:.55; }
.tl .tx { position:absolute; top:5px; font:11px/1 var(--f-num); color:var(--muted); white-space:nowrap; }
.work { display:grid; grid-template-columns:300px minmax(0,1fr); gap:10px; min-height:0; }
.side { display:grid; grid-template-rows:auto minmax(0,1.15fr) minmax(0,1fr); background:var(--panel); border:1px solid var(--line); border-radius:12px; min-height:0; overflow:hidden; }
.side-h { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px 6px; }
.side-h .hint { color:var(--faint); font-size:12px; }
.devlist { overflow:auto; padding:0 6px 8px; user-select:none; -webkit-user-select:none; }
.gw { display:flex; align-items:center; gap:8px; padding:9px 8px 4px; color:var(--muted); font-size:12px; cursor:default; }
.gw b { color:var(--fg); font-weight:600; }
.gw .cn { font-family:var(--f-num); font-size:11px; }
.gw.err b { color:var(--err); }
.dev { border-radius:9px; }
.dev + .dev { margin-top:2px; }
.dev-h { display:grid; grid-template-columns:14px 8px 20px minmax(0,1fr) auto 26px; align-items:center; gap:8px; padding:7px 4px 7px 6px; border-radius:9px; cursor:grab; touch-action:none; }
.dev-h:hover { background:var(--surface); }
.dev-h .nm { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dev-h .vv { font:12px var(--f-num); color:var(--muted); white-space:nowrap; text-align:right; }
.dev-h .vv.stale { color:var(--err); }
.dev-h .chev { width:14px; height:14px; transition:transform .15s; color:var(--faint); }
.dev.open .chev { transform:rotate(90deg); }
.dev-h .all { display:none; font-size:11px; padding:1px 6px; border-radius:5px; background:var(--accent); color:var(--on-accent); white-space:nowrap; }
body.alt .dev-h .all { display:inline-block; }
body.alt .dev-h .vv { display:none; }
body.alt .dev-h { cursor:copy; outline:1px dashed var(--accent); outline-offset:-1px; }
.dev .vz { display:none; padding:0 0 4px 36px; }
.dev.open .vz { display:grid; gap:1px; }
.v .icon-btn { width:20px; height:20px; }
.v .icon-btn svg.i { width:13px; height:13px; }

  return `<${tag} class="stat ${s.level}"${tag === 'button' ? ' data-act="alarmFilter"' : ''} data-tip="${esc(tip)}" aria-label="${esc(tip)}">${icon({ ok: 'sok', warn: 'swarn', crit: 'scrit' }[s.level])}<b>${s.n}</b></${tag}>`;
}

/* ================= шаг 1: приборы ================= */
function statusChip(d) {
  if (d.status === 'checking') return '<span class="chip chk"><span class="dot chk"></span>проверяю…</span>';
  if (d.status === 'ok') return '<span class="chip ok"><span class="dot ok"></span>найден</span>';
  if (d.status === 'missing') return '<span class="chip err"><span class="dot err"></span>не найден</span>';
  if (d.status === 'manual') return '<span class="chip">ручной ввод</span>';
  if (d.status === 'calc') return '<span class="chip">вычисляемый</span>';
  return '';
}
function devAvailable(d) {
  if (d.status === 'missing' || d.status === 'checking') return false;
  if (d.needs && !S.sel.has(d.needs)) return false;
  return true;
}

    </div>

function tileHTML(d) {
  const on = S.sel.has(d.id), av = devAvailable(d);
  const why = d.status === 'missing' ? d.note || 'не ответил на параметрах по умолчанию' : (d.needs && !S.sel.has(d.needs)) ? `нужен ${INST[d.needs].name}` : '';
  return `<div class="tile${av ? '' : ' off'}" role="button" tabindex="0" data-act="sel" data-dev="${d.id}" aria-pressed="${on}">
    <span class="ck">${on ? icon('check') : ''}</span>
    <span class="ic">${icon(d.icon)}</span>

    <span class="md">${esc(d.model)}</span>

    <span class="row">${statusChip(d)}${why ? `<span class="md">${esc(why)}</span>` : ''}<button class="icon-btn" data-act="gear" data-dev="${d.id}" data-tip="Настройки" aria-label="Настройки ${esc(d.name)}">⚙</button></span>
  </div>`;
}
function rowHTML(d) {
  const on = S.sel.has(d.id), av = devAvailable(d);
  return `<div class="rowi${av ? '' : ' off'}" role="button" tabindex="0" data-act="sel" data-dev="${d.id}" aria-pressed="${on}">
    <span class="ck2">${on ? icon('check') : ''}</span>${icon(d.icon)}<b>${esc(d.name)}</b><span class="md">${esc(d.model)}</span><span class="cn">${esc(d.conn)}</span>${statusChip(d)}
    <button class="icon-btn" data-act="gear" data-dev="${d.id}" data-tip="Настройки" aria-label="Настройки ${esc(d.name)}">⚙</button></div>`;
}
function runSearch() {
  if (S.searching) return;
  S.searching = true;
  const hw = devOrder.filter(i => ['direct', 'mk'].includes(INST[i].group));
  hw.forEach(i => INST[i].status = 'checking'); GW.status = 'checking';
  renderSelect();
  let left = hw.length;
  const done = () => { if (--left === 0) { S.searching = false; S.lastSearch = wallOf(S.simT); renderSelect(); } else renderSelect(); };
  const resolve = i => { INST[i].status = INST[i].found ? 'ok' : 'missing'; if (!INST[i].found) S.sel.delete(i); done(); };
  hw.filter(i => INST[i].group === 'direct').forEach(i => setTimeout(() => resolve(i), 220 + Math.random() * 420));
  setTimeout(() => { GW.status = 'ok'; renderSelect(); hw.filter(i => INST[i].group === 'mk').forEach(i => setTimeout(() => resolve(i), 150 + Math.random() * 450)); }, 320);
}

/* ---------- генератор формы из схемы драйвера ---------- */
function formHTML(d, vals, lockNonLive) {
  return SCH[d.sch].map(f => {
    const id = `f-${d.id}-${f.key}`, v = vals[f.key];
    const locked = lockNonLive && f.live === false;
    const dis = locked ? ' disabled' : '';
    if (f.type === 'info') return `<div class="f-row"><span class="f-l">${esc(f.label)}</span><span class="f-info">${esc(f.text)}</span></div>`;
    let ctl = '';
    if (f.type === 'select') ctl = `<select id="${id}" data-k="${f.key}"${dis}>${f.opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}"${String(ov) === String(v) ? ' selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
    else if (f.type === 'number') ctl = `<input id="${id}" data-k="${f.key}" type="number" inputmode="decimal" min="${f.min}" max="${f.max}" step="${f.step}" value="${v}"${dis}>`;
    else if (f.type === 'text') ctl = `<input id="${id}" data-k="${f.key}" type="text" value="${esc(v)}"${dis}>`;
    else if (f.type === 'toggle') ctl = `<label class="sw"><input id="${id}" data-k="${f.key}" type="checkbox"${v ? ' checked' : ''}${dis}><span></span></label>`;
    else if (f.type === 'action') ctl = `<button type="button" id="${id}" class="btn sm" data-act="devAction" data-dev="${d.id}" data-k="${f.key}"${dis}>${esc(f.btn)}</button>`;
    return `<div class="f-row"><label class="f-l" for="${id}">${esc(f.label)}${f.live === false ? '' : '<em data-tip="Можно менять во время записи">на ходу</em>'}${f.hint ? `<span class="ii" tabindex="0" data-tip="${esc(f.hint)}" aria-label="${esc(f.hint)}">i</span>` : ''}${locked ? `<span class="lk" data-tip="Меняется на паузе" aria-label="Меняется на паузе">${icon('lock')}</span>` : ''}</label>
      <div class="f-c">${ctl}${f.unit ? `<span class="unit">${esc(f.unit)}</span>` : ''}</div></div>`;
  }).join('');
}
function readForm(root) {
  const o = {};
  $$('[data-k]', root).forEach(el => { if (el.tagName === 'BUTTON') return; o[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? parseFloat(el.value) : el.value; });
  return o;
}
function showVal(f, v) {
  if (f.type === 'toggle') return v ? 'вкл' : 'выкл';
  if (f.type === 'select') { const o = f.opts.find(o => String(Array.isArray(o) ? o[0] : o) === String(v)); return (Array.isArray(o) ? o[1] : o) + (f.unit ? ' ' + f.unit : ''); }
  return String(v).replace('.', ',') + (f.unit ? ' ' + f.unit : '');
}

/* ================= создание опыта ================= */
function startPrep() {
  const name = ($('#runNameNew') && $('#runNameNew').value.trim()) || S.draftName || 'опыт';
  INST.th.chans = INST.th.chans.filter(id => !id.startsWith('th:roi')); rois = []; roiSeq = 0;
  S.run = newRun(name, devOrder.filter(i => S.sel.has(i)), S.simT - 300);
  for (const id of S.run.chans) fill(S.run, id, S.run.fromA, S.simT);
  S.run.panels = templatePanels(S.template).filter(p => p.series.every(id => S.run.chans.includes(id)));
  S.run.journal.push({ a: S.simT, src: 'sys', text: `Подготовка: ${S.run.devs.size} приборов на связи, монитор идёт, на диск не пишется`, by: '' });
  S.ptab = S.run.panels.length ? 'graphs' : 'devs';
  go('exp');
}

function openCtx(x, y, devId) {
  const c = $('#ctx');
  showCtx(`<button data-act="ctxOpen" data-dev="${devId}">Окно прибора <small>двойной клик</small></button>
    ${devId === 'mk1' ? '' : `<button data-act="ctxAll" data-dev="${devId}">Все графики <small>Alt + тащить</small></button>`}
    <button data-act="ctxReconnect" data-dev="${devId}">Переподключить</button>`, x, y);
}
function showCtx(html, x, y) {
  const c = $('#ctx'); c.innerHTML = html; c.hidden = false; const r = c.getBoundingClientRect();
  c.style.left = Math.min(x, innerWidth - r.width - 8) + 'px'; c.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
}
function roiAt(cv, p, e) {
  const rc = cv.getBoundingClientRect(), x = e.clientX - rc.left, y = e.clientY - rc.top;
  return rois.find(q => Math.hypot(p.geo.ox + (q.col + .5) * p.geo.sc - x, p.geo.oy + (q.row + .5) * p.geo.sc - y) < 10);
}
function removeRoi(name, quiet) {
  const id = 'th:roi' + name, r = S.run;
  rois = rois.filter(q => q.name !== name);
  INST.th.chans = INST.th.chans.filter(c => c !== id);
  r.chans = r.chans.filter(c => c !== id); delete r.data[id]; delete r.next[id];
  for (const p of r.panels) p.series = p.series.filter(c => c !== id);
  r.panels = r.panels.filter(p => p.series.length);
  delete CH[id];
  if (!quiet) jpush('sys', `Тепловизор: точка ${name} удалена`);
}
function closeCtx() { $('#ctx').hidden = true; const p = $('#demoPop'); if (p) p.hidden = true; }
document.addEventListener('contextmenu', e => {
  if (S.screen !== 'exp') return;
  const h = e.target.closest('[data-drag="dev"]'), g = e.target.closest('[data-gw]'), cv = e.target.closest('canvas[data-cv-panel]');
  if (h) { e.preventDefault(); openCtx(e.clientX, e.clientY, h.dataset.dev); } else if (g) { e.preventDefault(); openCtx(e.clientX, e.clientY, 'mk1'); }
  else if (cv) { const p = findPanel(cv.dataset.cvPanel); if (!p || p.kind !== 'frame' || !p.geo || !rois.length) return; const q = roiAt(cv, p, e); e.preventDefault();
    showCtx((q ? `<button data-act="roiDel" data-n="${q.name}">Удалить точку ${q.name}</button>` : '') + '<button data-act="roiClear">Удалить все точки</button>', e.clientX, e.clientY); }
});
document.addEventListener('dblclick', e => {
  if (S.screen !== 'exp') return;
  const h = e.target.closest('[data-drag="dev"]'); if (h) { openDevWin(h.dataset.dev); return; }
  if (e.target.closest('[data-gw="1"]')) openDevWin('mk1');
});

/* ================= тревоги, состояния, журнал ================= */
function setState(st) {
  const r = S.run, t = S.simT;
  if (st === 'rec' && r.state === 'prep') { r.t0 = t; r.state = 'rec'; jpush('sys', `Старт записи, предзапись ${fmtClock(t - r.fromA)}`, t, byLabel()); }
  else if (st === 'pause') { r.state = 'pause'; r.pauses.push({ a: t - r.t0, b: null }); jpush('sys', 'Пауза', t, byLabel()); }
  else if (st === 'resume') { r.state = 'rec'; r.pauses[r.pauses.length - 1].b = t - r.t0; jpush('sys', 'Продолжить', t, byLabel()); }
  else if (st === 'stop' && r.state === 'pause') {
    r.pauses[r.pauses.length - 1].b = t - r.t0; r.doneA = t; jpush('sys', `Стоп, записано ${fmtDur(t - r.t0)}`, t, byLabel()); r.state = 'done';
    S.finished.unshift({ name: r.name, when: '30.09 · ' + hhmmss(wallOf(r.t0)).slice(0, 5), dur: fmtDur(t - r.t0), n: r.devs.size, note: 'только что' });
  }
  renderCtrl(); renderDock(); updateTop(); updateTimeline();
}

/* ================= анализ (заглушка) ================= */
function renderAnalysis() {
  const rows = [...S.finished, ...RECENT];
  $('#s-analysis').innerHTML = `<div class="an">
    <div class="wiz-h"><button class="icon-btn" data-act="home" data-tip="Главная" aria-label="Главная">${icon('home')}</button><h2 style="margin:0;font:600 20px/1.2 var(--f-brand)">Анализ</h2></div>
    <p class="note" style="border:0;padding:0">Разбор завершённого опыта откроется отдельным окном: те же панели, но из файла, с курсором по времени. Что и как сравнивать между опытами, продумаем отдельно.</p>
    <div class="an-t"><table class="t"><thead><tr><th>Опыт</th><th>Начало</th><th>Длительность</th><th>Приборов</th><th>Заметка</th><th></th></tr></thead><tbody>
      ${rows.map(x => `<tr><td><b>${esc(x.name)}</b></td><td class="mono">${esc(x.when)}</td><td class="mono">${esc(x.dur)}</td><td class="mono">${x.n}</td><td>${esc(x.note)}</td><td><button class="btn sm" disabled>Открыть</button></td></tr>`).join('')}
    </tbody></table></div></div>`;
}

/* ================= действия ================= */
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
const ACT = {
  home: () => { closeModal(); go('home'); },
  toExp: () => go('exp'),
  cancelPrep: () => { S.run = null; renderHome(); },
  new: () => { S.sel = new Set(); S.template = 'empty'; S.draftName = `опыт_${hhmmss(wallOf(S.simT)).slice(0, 5).replace(':', '')}`; go('select'); if (!S.lastSearch) runSearch(); },
  analysis: () => { closeModal(); go('analysis'); },
  search: runSearch,
  view: b => { S.view = b.dataset.v; renderSelect(); },
  sel: b => { const d = INST[b.dataset.dev]; if (!devAvailable(d)) { toast(d.status === 'missing' ? `${d.name} не найден. Параметры подключения — в ⚙` : `${d.name}: нужен ${INST[d.needs].name}`); return; }
    S.sel.has(d.id) ? S.sel.delete(d.id) : S.sel.add(d.id); for (const i of devOrder) if (INST[i].needs && !S.sel.has(INST[i].needs)) S.sel.delete(i); keepName(); renderSelect(); },
  gear: (b, e) => { e.stopPropagation(); keepName(); openDevWin(b.dataset.dev, 'set'); },
  catalog: () => { keepName(); openCatalog(); },
  catAdd: b => addFromCatalog(b.dataset.t),
  toSettings: () => { keepName(); go('settings'); },
  toSelect: () => go('select'),
  startPrep: () => { keepName(); startPrep(); },
  cfgDev: b => { S.cfgDev = b.dataset.dev; renderSettings(); },
  cfgReset: b => { const d = INST[b.dataset.dev]; for (const f of SCH[d.sch]) if ('def' in f) d.set[f.key] = f.def; renderSettings(); },
  start: () => setState('rec'), pause: () => setState('pause'), resume: () => setState('resume'), stop: () => setState('stop'),
  win: b => { S.win = b.dataset.v === 'all' ? 'all' : +b.dataset.v; $$('[data-act="win"]').forEach(x => x.setAttribute('aria-pressed', x === b)); updateTimeline(); },
  demo: b => { const p = $('#demoPop'); const was = p.hidden; closeCtx(); p.hidden = !was; b.setAttribute('aria-expanded', String(was)); },
  speed: b => { S.speed = +b.dataset.v; $$('[data-act="speed"]').forEach(x => x.setAttribute('aria-pressed', x === b)); },
  wide: b => { const p = findPanel(b.dataset.p), g = $('.dgrid'); const cols = g ? getComputedStyle(g).gridTemplateColumns.split(' ').length : 1;
    const order = cols >= 3 ? [1, 2, 3] : [1, 3]; p.w = order[(order.indexOf(p.w) + 1) % order.length]; renderDock(); },
  detach: b => { const p = findPanel(b.dataset.p); const el = b.closest('.panel').getBoundingClientRect(); p.float = { x: clamp(el.left + 40, 8, innerWidth - 480), y: clamp(el.top + 40, 8, innerHeight - 340), w: Math.min(560, innerWidth - 32), h: 340 }; renderDock(); },
  roiDel: b => { closeCtx(); removeRoi(b.dataset.n); renderDevList(); renderDock(); },
  roiClear: () => { closeCtx(); const n = rois.length; [...rois].forEach(q => removeRoi(q.name, true)); if (n) jpush('sys', `Тепловизор: удалены все точки (${n})`); renderDevList(); renderDock(); },
  reattach: b => { findPanel(b.dataset.p).float = null; renderDock(); },
  closePanel: b => { const r = S.run; r.panels = r.panels.filter(p => p.id !== b.dataset.p); renderDock(); },
  rmSeries: b => { const p = findPanel(b.dataset.p); p.series = p.series.filter(id => id !== b.dataset.c); renderDock(); },
  jf: b => { S.jf = b.dataset.v; $$('[data-act="jf"]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderJournal(true); },
  alarmFilter: () => { S.jf = 'warn'; if (isPhone()) setPtab('journal'); $$('[data-act="jf"]').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === 'warn')); renderJournal(true); },
  jpin: b => { const a = +b.dataset.a; S.pin = S.pin === a ? null : a; const rel = a - refT(); if (S.pin != null && S.win !== 'all' && rel < endA() - refT() - S.win) { S.win = 'all'; $$('[data-act="win"]').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === 'all')); } renderJournal(); },
  ptab: b => setPtab(b.dataset.v),
  devMenu: (b, e) => { e.stopPropagation(); const r = b.getBoundingClientRect(); openCtx(r.left, r.bottom + 4, b.dataset.dev); },
  ctxOpen: b => { closeCtx(); openDevWin(b.dataset.dev); },
  ctxAll: b => { closeCtx(); const ids = devViz(b.dataset.dev); addPanels(ids); toast(`${INST[b.dataset.dev].name}: графиков добавлено — ${ids.length}`); },
  ctxReconnect: b => { closeCtx(); const n = b.dataset.dev === 'mk1' ? GW.name : INST[b.dataset.dev].name; jpush('sys', `${n}: переподключение, связь есть`, S.simT, byLabel()); toast(`${n}: переподключено`); },
  mClose: closeModal, mApply: applyModal,
  mTab: b => { if (M.tab === 'set') M.draft = { ...M.draft, ...readForm($('#mForm')) }; $$('[data-rename]').forEach(el => M.names[el.dataset.rename] = el.value); M.tab = b.dataset.v; renderModal(); },
  mReset: () => { for (const f of SCH[M.d.sch]) if ('def' in f) M.draft[f.key] = f.def; renderModal(); },
  devAction: b => { const d = INST[b.dataset.dev]; const v = (Math.random() - .5).toFixed(1).replace('.', ',').replace('-', '−'); if (S.screen === 'exp') jpush('set', `${d.name}: ноль снят (${v} Па)`, S.simT, byLabel()); toast(`${d.name}: ноль снят, смещение ${v} Па`); },
  reconnect: () => { const d = M.d; if (S.screen === 'exp') jpush('sys', `${d.name}: переподключение, связь есть`, S.simT, byLabel()); toast(`${d.name}: переподключено`); },
  manualAdd: () => { const v = num($('#mVal').value); if (!isFinite(v)) { toast('Введите число'); return; } const c = CH[M.d.chans[0]]; const d = S.run.data[c.id]; d.t.push(S.simT); d.v.push(v); jpush('manual', `${M.d.name}: ${c.name} ${fmtV(v, c.dp)} ${c.unit}`, S.simT, byLabel()); closeModal(); toast('Отсчёт записан'); },
};
function keepName() { const el = $('#runNameNew'); if (el) S.draftName = el.value; }
function setPtab(v) { S.ptab = v; $('#s-exp').dataset.ptab = v; $$('[data-act="ptab"]').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === v)); if (v === 'journal') renderJournal(true); }

document.addEventListener('click', e => {
  const hd = e.target.closest('.dev-h');
  if (hd && !e.target.closest('[data-act]')) { const id = hd.dataset.dev; hd.parentElement.classList.toggle('open'); openDevs.has(id) ? openDevs.delete(id) : openDevs.add(id); return; }
  const b = e.target.closest('[data-act]');
  if (!b) { if (!e.target.closest('.pop, .ctx')) closeCtx(); if (e.target.id === 'modal') closeModal(); return; }
  if (b.disabled || b.getAttribute('aria-disabled') === 'true') return;
  if (b.dataset.act !== 'demo' && !b.closest('.pop')) closeCtx();
  const f = ACT[b.dataset.act]; if (f) f(b, e);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'showMissing') { S.showMissing = e.target.checked; keepName(); renderSelect(); }
  else if (e.target.id === 'tplSel') { S.template = e.target.value; const t = TEMPLATES.find(x => x.id === S.template); S.sel = new Set(t.devs.filter(i => devAvailable(INST[i]) || INST[i].needs)); keepName(); if (S.template === 'patron' && /^опыт_/.test(S.draftName)) S.draftName = 'dry04'; renderSelect(); }
  else if (e.target.id === 'mkDown') {
    S.mkDown = e.target.checked;
    if (S.run) { const names = devOrder.filter(i => S.run.devs.has(i) && INST[i].group === 'mk').map(i => INST[i].name).join(', ');
      if (S.mkDown) raise('mk', 'crit', `МК-1: нет связи, без данных: ${names}`); else clearAlarm('mk', 'МК-1: связь восстановлена'); }
    renderDevList();
  }
  else if (e.target.closest('#cfgForm')) { const d = INST[$('#cfgForm').dataset.dev]; Object.assign(d.set, readForm($('#cfgForm'))); renderSettings(); }
  else if (e.target.id === 'runNameEdit' && S.run) { const v = e.target.value.trim(); if (v && v !== S.run.name) { jpush('set', `Опыт переименован: ${S.run.name} → ${v}`, S.simT, byLabel()); S.run.name = v; } }
});
/* журнал: время заметки = первое нажатие клавиши */
document.addEventListener('input', e => {
  if (e.target.id !== 'jInput') return;
  const v = e.target.value;
  if (v && S.noteA == null) S.noteA = S.simT; if (!v) S.noteA = null;
  const chip = $('#jT'); chip.hidden = S.noteA == null;
  if (S.noteA != null) chip.textContent = S.run.t0 != null ? fmtClock(S.noteA - S.run.t0) : hhmmss(wallOf(S.noteA));
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'jForm') return; e.preventDefault();
  const inp = $('#jInput'), text = inp.value.trim();
  if (text) jpush('user', text, S.noteA != null ? S.noteA : S.simT, isPhone() ? 'телефон' : '');
  else { S.run.marks++; jpush('user', `метка ${S.run.marks}`, S.simT, isPhone() ? 'телефон' : ''); }
  inp.value = ''; S.noteA = null; $('#jT').hidden = true;
});
/* ROI: клик по кадру тепловизора создаёт канал */
document.addEventListener('click', e => {
  const cv = e.target.closest && e.target.closest('canvas[data-cv-panel]'); if (!cv) return;
  const p = findPanel(cv.dataset.cvPanel); if (!p || p.kind !== 'frame' || !p.geo) return;
  const rc = cv.getBoundingClientRect(), col = Math.floor((e.clientX - rc.left - p.geo.ox) / p.geo.sc), row = Math.floor((e.clientY - rc.top - p.geo.oy) / p.geo.sc);
  if (col < 0 || col >= IW || row < 0 || row >= IH || roiAt(cv, p, e)) return;
  const used = new Set(rois.map(q => q.name)), name = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].find(ch => !used.has(ch));
  if (!name) { toast('Точек не больше 26'); return; }
  const id = 'th:roi' + name; roiSeq++;
  const onStripe = row >= SY0 && row < SY1 && col >= BX0 && col < BX1;
  CH[id] = { id, k: 'roi' + name, dev: 'th', name: `точка ${name}`, kind: 'ts', unit: '°C', dp: 1, color: 3 + roiSeq, gen: t => apparent(col, row, t, epsNow()) };
  INST.th.chans.push(id); rois.push({ name, col, row });
  const r = S.run; r.chans.push(id); r.data[id] = { t: [], v: [] }; r.next[id] = null; fill(r, id, r.fromA, S.simT);
  const where = col >= BX0 && col < BX1 ? `${fmtV(colMM(col), 0)} мм от входа` : 'вне корпуса';
  jpush('sys', `Тепловизор: точка ${name}, ${where}${onStripe ? '' : ', вне полосы'}`, S.simT, byLabel());
  openDevs.add('th'); renderDevList(); $$('[data-act="roiClear"]').forEach(x => x.hidden = false); toast(`Точка ${name}`);
});

/* ================= каталог приборов ================= */
function openCatalog() {
  const types = [['pt100', 'Плата Pt100 ×8, Modbus RTU'], ['thermal', 'Тепловизор UVC'], ['cam', 'Камера UVC'], ['scd41', 'SCD41, CO₂ через МК'], ['sht45', 'SHT4x, влажность через МК'], ['sdp810', 'SDP8xx, перепад давления через МК'], ['o2', 'O₂-ячейка через ADS1115'], ['manual', 'Ручной прибор']];
  $('#modal').innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Добавить прибор">
    <div class="m-h"><span class="ic">${icon('plus')}</span><h3>Добавить прибор</h3><button class="icon-btn" data-act="mClose" aria-label="Закрыть">${icon('x')}</button></div>
    <div class="m-b" style="padding-top:10px"><table class="t"><tbody>${types.map(([t, l]) => `<tr><td>${icon(TYPES[t].icon)}</td><td><b>${esc(l)}</b><br><span class="mono">${esc(TYPES[t].model)}</span></td><td style="text-align:right"><button class="btn sm" data-act="catAdd" data-t="${t}">Добавить</button></td></tr>`).join('')}</tbody></table></div>
    <div class="m-f"><button class="btn" data-act="mClose">Закрыть</button></div></div>`;
  $('#modal').hidden = false; M = null;
}
function addFromCatalog(type) {
  const T = TYPES[type]; const same = devOrder.filter(i => INST[i].type === type).length + 1;
  const id = type + '_' + same + '_' + Date.now().toString(36);
  const conn = { pt100: 'Modbus RTU · COM26 · 9600 · адр. 1', thermal: 'USB · UVC', cam: 'USB · UVC', scd41: 'I²C · TCA ch3 · 0x62', sht45: 'I²C · TCA ch3 · 0x44', sdp810: 'I²C · TCA ch6 · 0x25', o2: 'I²C · 0x49', manual: 'ручной ввод' }[type];
  const inst = addInst(type, { id, name: `${T.title} #${same}`, conn, found: type === 'manual', note: 'по умолчанию не ответил: задайте адрес или порт в ⚙' });
  closeModal();
  if (inst.group !== 'manual') { inst.status = 'checking'; S.showMissing = true; renderSelect(); setTimeout(() => { inst.status = 'missing'; renderSelect(); toast(`${inst.name} не найден. Параметры подключения — в ⚙`); }, 600); }
  else { S.sel.add(inst.id); renderSelect(); }
}

/* ================= подсказки ================= */
const tipEl = $('#tip'); let tipT = 0, tipFor = null;
function showTip(el) {
  const txt = el.dataset.tip; if (!txt || !document.contains(el)) return;
  tipEl.textContent = txt; tipEl.hidden = false;
  const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  let y = r.bottom + 8; if (y + t.height > innerHeight - 8) y = r.top - t.height - 8;
  tipEl.style.left = clamp(r.left + r.width / 2 - t.width / 2, 8, innerWidth - t.width - 8) + 'px'; tipEl.style.top = Math.max(8, y) + 'px';
}
function hideTip() { clearTimeout(tipT); tipEl.hidden = true; tipFor = null; }
document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el === tipFor) return; hideTip(); if (!el || drag) return;
  tipFor = el; tipT = setTimeout(() => showTip(el), 350);
});
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && el.matches(':focus-visible')) { hideTip(); tipFor = el; showTip(el); } });
document.addEventListener('focusout', hideTip);
document.addEventListener('pointerdown', hideTip, true);
addEventListener('scroll', hideTip, true);

/* ================= цикл ================= */
let lastReal = performance.now(), lastDraw = 0, lastSide = 0;
function loop(now) {
  const dt = Math.min(.25, (now - lastReal) / 1000); lastReal = now;
  tick(dt);
  if (S.screen === 'exp' && S.run) {
    updateTop();
    if (now - lastDraw > 90) { drawAll(); lastDraw = now; }
    if (now - lastSide > 350) { updateSide(); updateTimeline(); lastSide = now; }
  } else if (S.screen === 'home' && now - lastSide > 500) { updateHomePlate(); lastSide = now; }
  requestAnimationFrame(loop);
}

demoRun();
go('home');
requestAnimationFrame(loop);
})();
</script>
