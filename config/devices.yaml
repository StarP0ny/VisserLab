# Приборы стенда: id → драйвер, имя, настройки (параметры подключения — тоже настройки).
# Подписи каналов переопределяются в `channels`. Приборы за шлюзом — в `children` шлюза.
# Снимок всего этого на момент старта попадает в meta.yaml опыта.

collector:
  port: 8765
  runs_dir: runs
  preroll_s: 300          # предзапись, с
  preroll_fps: 1          # кадры в предзаписи прорежены до этой частоты
  record_default: [pt100] # приборы для `python -m visserlab record` без --devices

devices:
  pt100:
    driver: pta8d08
    name: Pt100 ×8
    settings: {port: COM26, baud: "9600", addr: 1, period: "1"}
    channels:
      T1: ch1 корпус, вход
      T2: ch2 корпус, середина
      T3: ch3 корпус, выход
      T4: ch4 корпус, плёнка
      T5: ch5 газ, вход
      T6: ch6 газ, выход
      T7: ch7 слой
      T8: ch8 среда

  syringe:
    driver: manual
    name: Шприц-проба
    settings: {channel: CO₂, unit: "%", dp: 2}

  scale:
    driver: manual
    name: Весы
    settings: {channel: масса, unit: г, dp: 2}

  # ---- симуляторы: разработка интерфейса и тесты без стенда
  sim_pt100:
    driver: sim_pt100
    channels:
      T1: ch1 корпус, вход
      T2: ch2 корпус, середина
      T3: ch3 корпус, выход
      T8: ch8 среда
  sim_thermal:
    driver: sim_thermal
  sim_mk:
    driver: sim_mk
    name: МК-1 (сим)
    children:
      sim_scd41: {driver: sim_scd41, name: "SCD41 #1 (сим)"}
      sim_sht1: {driver: sim_sht45, name: "SHT45 #1 (сим)", settings: {place: inlet}}
      sim_sht2: {driver: sim_sht45, name: "SHT45 #2 (сим)", sim_absent: true}
      sim_sdp: {driver: sim_sdp810, name: "SDP810 (сим)"}
  sim_ah:
    driver: abs_humidity
    name: Абс. влажность (сим)
    settings: {rh: "sim_sht1:rh", t: "sim_sht1:t"}
