# Конфигурация стенда: что и куда подключено.
# Копируется целиком в meta.yaml каждого прогона — меняйте здесь перед прогоном,
# и через месяц будет видно, что стояло в ch5 в тот день.

runs_dir: runs

sources:
  pt100:
    port: COM26
    baud: 9600
    addr: 1
    period_s: 1.0
    # Подключённые каналы. Неперечисленные тоже пишутся в CSV, но в консоли/UI
    # не показываются: пустой вход платы читается как ~97,7 °C, по значению его не отличить.
    channels:
      1: {point: probe, sensor: test, note: "тестовый датчик"}
      # раскладка из таблицы датчиков стенда Visser:
      # 1: {point: corpus_in,  sensor: patch,      note: "корпус, вход"}
      # 2: {point: corpus_mid, sensor: patch,      note: "корпус, середина"}
      # 3: {point: corpus_out, sensor: patch,      note: "корпус, выход"}
      # 4: {point: corpus_ref, sensor: film_M222,  note: "рядом с ch2, сравнение патч/плёнка"}
      # 5: {point: gas_in,     sensor: sheath_SY,  note: "карман T1, вход патрона"}
      # 6: {point: gas_out,    sensor: sheath_SY,  note: "струя у обечайки"}
      # 7: {point: bed,        sensor: sheath_450, note: "в слое"}
      # 8: {point: ambient,    sensor: sheath_SY,  note: "среда, экран от корпуса"}
