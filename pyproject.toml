[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visserlab"
version = "0.2.0"
description = "Регистратор опытов: приборы-плагины, запись, журнал, веб-интерфейс"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
visserlab = "visserlab.__main__:main"

[tool.setuptools.packages.find]
include = ["visserlab*"]

[tool.setuptools.package-data]
visserlab = ["web/static/*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]
